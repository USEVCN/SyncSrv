name: Verify source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check source publication boundaries
        shell: bash
        run: python scripts/public-source-check.py
      - name: Build safe local storage bridge
        shell: bash
        run: python scripts/build-native-io.py --host-only
      - name: Frontend dependencies, notices and build
        shell: bash
        working-directory: Frontend
        run: |
          npx --yes npm@11.6.2 ci
          npm audit --audit-level=high
          npm run check:licenses
          npm run build
      - name: Backend isolated tests
        shell: bash
        working-directory: Backend
        run: |
          python ../scripts/release_gate.py stamp
          mvn --batch-mode verify
          python ../scripts/release_gate.py verify
      - name: Native path containment tests
        if: ${{ !cancelled() }}
        working-directory: NativeIO
        run: go test -race ./...
      - name: Full dependency and VEX review
        if: matrix.os == 'macos-latest'
        shell: bash
        run: python scripts/dependency-audit.py --output work/dependency-review
      - name: Agent tests
        if: ${{ !cancelled() }}
        working-directory: Agent
        run: go test -race ./...
      - name: Source size and UI license gates
        shell: bash
        run: |
          python scripts/check-source.py
          python scripts/test-public-source-check.py
          python scripts/test-ui-licenses.py
          python scripts/test-source-dependency-audit.py
          python scripts/test-release-gate.py
      - name: Frontend tests
        working-directory: Frontend
        run: npm test -- --maxWorkers=2
