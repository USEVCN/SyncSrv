server:
  address: ${SYNCSRV_BIND:127.0.0.1}
  port: ${SYNCSRV_PORT:18010}
  error:
    include-message: never
spring:
  config:
    import: optional:file:./config/application-private.yml,optional:file:../config/application-private.yml
  application:
    name: SyncSrv
  main:
    banner-mode: off
  jackson2:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
syncsrv:
  updates:
    manifest: ${SYNCSRV_UPDATE_MANIFEST:}
    config: ${SYNCSRV_UPDATE_CONFIG:/etc/syncsrv/update.json}
    allow-http-origin: ${SYNCSRV_UPDATE_HTTP_ORIGIN:}
  center-releases: ${SYNCSRV_CENTER_RELEASES:artifacts/center-releases}
  production: ${SYNCSRV_PRODUCTION:false}
  data: ${SYNCSRV_DATA:./data}
  agent-releases: ${SYNCSRV_AGENT_RELEASES:auto}
logging:
  level:
    root: INFO
    com.hierynomus: WARN
    net.schmizz: WARN

  file:
    name: ${SYNCSRV_LOG:./logs/syncsrv.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
